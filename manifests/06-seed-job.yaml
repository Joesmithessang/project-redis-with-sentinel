# Project 4 — Task 5: 50 keys of the form <ID>:seed:<n>, plus owner=<ID>.
# Discovers the master through Sentinel like everything else in this project —
# nothing here, or anywhere else in the repo, hardcodes redis-${STUDENT_ID}-0
# as a CLIENT target.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-${STUDENT_ID}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              NS="redis-${STUDENT_ID}"
              MASTER_NAME="mymaster-${STUDENT_ID}"
              M=$(redis-cli -h sentinel-svc.$NS.svc.cluster.local -p 26379 --raw \
                  sentinel get-master-addr-by-name "$MASTER_NAME" | head -n1)
              echo "seeding into master $M"
              redis-cli -h "$M" -p 6379 set owner "${STUDENT_ID}"
              n=1
              while [ $n -le 50 ]; do
                redis-cli -h "$M" -p 6379 set "${STUDENT_ID}:seed:$n" "value-$n" > /dev/null
                n=$((n+1))
              done
              echo "seeded 50 keys + owner"
              redis-cli -h "$M" -p 6379 dbsize
